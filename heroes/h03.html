<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>03 — Le damier</title>
<link rel="stylesheet" href="base.css"><link rel="icon" href="../img/favicon.png">
<style>
/* 03 — Les cases du papier damier se retournent en vague et révèlent le burger */
.hero{background:var(--ch);color:var(--ink)}
.hd .logo{fill:var(--ink)}
.grid{position:absolute;inset:0;display:grid;grid-template-columns:repeat(6,1fr);z-index:2;perspective:900px}
.c{position:relative;transform-style:preserve-3d}
.c i,.c b{position:absolute;inset:0;backface-visibility:hidden}
.c i{background:var(--cream)}
.c:nth-child(12n+2) i,.c:nth-child(12n+4) i,.c:nth-child(12n+6) i,.c:nth-child(12n+7) i,.c:nth-child(12n+9) i,.c:nth-child(12n+11) i{background:var(--ink)}
.c b{transform:rotateY(180deg)}
.paper{position:absolute;left:0;right:0;bottom:0;height:34%;z-index:3;
  background:conic-gradient(var(--cream) 25%,var(--ink) 0 50%,var(--cream) 0 75%,var(--ink) 0) 0 0/44px 44px;
  clip-path:polygon(0 18%,100% 0,100% 100%,0 100%);opacity:0}
.burger{position:absolute;left:50%;top:30%;width:84vw;max-width:480px;translate:-50% 0;z-index:5}
.title{position:absolute;left:var(--pad);right:var(--pad);top:calc(84px + var(--st));z-index:6;font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:12.6vw;line-height:.84;letter-spacing:-.045em}
.title em{font-family:var(--f-s);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.01em;display:block;font-size:.8em;margin-top:.08em}
.ln{display:block;overflow:hidden}.ln>span{display:inline-block}
.ctas{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(22px + var(--sb));z-index:6;opacity:0}
.badge{position:absolute;right:var(--pad);top:46%;z-index:6;width:92px;height:92px;border-radius:50%;background:var(--g);color:var(--cream);display:grid;place-items:center;text-align:center;font-family:var(--f-m);font-size:9px;letter-spacing:.1em;line-height:1.3;text-transform:uppercase;rotate:-12deg;opacity:0}
.badge b{display:block;font-family:var(--f-d);font-weight:900;font-stretch:125%;font-size:26px;letter-spacing:-.02em;color:var(--ch)}
</style></head><body>
<section class="hero">
  <header class="hd"><svg class="logo"><use href="../assets/logo-sprite.svg#lg"/></svg><div class="hd__r"><span class="status"><i style="background:var(--g)"></i>Ouvert</span><button class="menu" style="background:var(--ink)" aria-label="Menu"><i style="background:var(--ch)"></i><i style="background:var(--ch)"></i></button></div></header>
  <div class="grid" id="grid"></div>
  <div class="paper" id="paper"></div>
  <h1 class="title"><span class="ln"><span>Le smash</span></span><span class="ln"><span>qui fait</span></span><span class="ln"><span><em>parler Nantes.</em></span></span></h1>
  <img class="burger" id="burger" src="../img/burger-sh.webp" alt="Smash burger BUNZO">
  <div class="badge" id="badge"><div><b>4,8</b>3 488 avis<br>Google</div></div>
  <div class="ctas"><a class="btn btn--ink" href="#">Voir la carte</a><a class="btn btn--g" href="#">Commander</a></div>
</section>
<script src="../js/vendor/gsap.min.js"></script>
<script>
const g=document.getElementById('grid');const cols=6,size=innerWidth/cols,rows=Math.ceil(innerHeight/size);
g.style.gridAutoRows=size+'px';
for(let i=0;i<cols*rows;i++){const c=document.createElement('div');c.className='c';
  const dark=((i%cols)+Math.floor(i/cols))%2===1;c.innerHTML='<i style="background:'+(dark?'var(--ink)':'var(--cream)')+'"></i><b></b>';g.appendChild(c);}
const cells=[...g.children];
gsap.set('.ln>span',{yPercent:110});
gsap.timeline({delay:.35})
  .to(cells.map(c=>c.firstChild),{rotationY:-180,duration:.7,ease:'power2.inOut',stagger:{grid:[rows,cols],from:'end',amount:.9}})
  .set(g,{display:'none'})
  .to('#paper',{opacity:1,duration:.01},'-=.5').from('#paper',{yPercent:100,duration:.9,ease:'expo.out'},'<')
  .to('.ln>span',{yPercent:0,stagger:.08,duration:1,ease:'expo.out'},'-=1')
  .fromTo('#burger',{y:-innerHeight*.6,rotation:-14},{y:0,rotation:-3,duration:.9,ease:'bounce.out'},'-=.8')
  .to('#badge',{opacity:1,duration:.01}).from('#badge',{scale:0,rotation:-90,duration:.8,ease:'back.out(2)'},'<')
  .to('.ctas',{opacity:1,duration:.6},'-=.4')
  .to('#burger',{y:-8,rotation:-1,duration:2.4,ease:'sine.inOut',yoyo:true,repeat:-1});
</script>
</body></html>
