<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>01 — Smash typographique</title>
<link rel="stylesheet" href="base.css"><link rel="icon" href="../img/favicon.png">
<style>
/* 01 — Le mot SMASH est littéralement écrasé par le burger (largeur variable de la police) */
.hero{background:radial-gradient(130% 70% at 50% 30%,#0B4A2C 0%,var(--g) 55%,var(--g-deep) 100%)}
.word{position:absolute;left:0;right:0;top:auto;bottom:calc(206px + var(--sb));text-align:center;font-weight:900;text-transform:uppercase;line-height:.78;letter-spacing:-.04em;color:var(--ch);
  font-size:var(--fs,30vw);font-stretch:62%;transform-origin:50% 100%;white-space:nowrap}
.burger{position:absolute;left:50%;top:auto;bottom:calc(206px + var(--fs,30vw)*.3 + var(--sb));width:84vw;max-width:460px;translate:-50% 0;z-index:3}
.shadow{position:absolute;left:50%;bottom:calc(196px + var(--fs,30vw)*.3 + var(--sb));width:60vw;height:4vw;translate:-50% 0;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent);z-index:2;opacity:0}
.crumbs span{position:absolute;width:8px;height:6px;border-radius:40% 60% 50% 30%;z-index:4}
.foot{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(22px + var(--sb));display:grid;gap:16px;z-index:5}
.sub{font-size:15px;line-height:1.45;max-width:30ch;opacity:.85}
.sub b{color:var(--ch);font-weight:700}
.kick{display:flex;justify-content:space-between;font-family:var(--f-m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:.6}
.foot>*{opacity:0}
</style></head><body>
<section class="hero">
  <header class="hd"><svg class="logo"><use href="../assets/logo-sprite.svg#lg"/></svg><div class="hd__r"><span class="status"><i></i>Ouvert</span><button class="menu" aria-label="Menu"><i></i><i></i></button></div></header>
  <h1 class="word" id="word" aria-label="Smash">Smash</h1>
  <div class="shadow" id="shadow"></div>
  <img class="burger" id="burger" src="../img/burger-sh.webp" alt="Smash burger BUNZO">
  <div class="crumbs" id="crumbs"></div>
  <div class="foot">
    <p class="kick"><span>Bœuf frais français</span><span>Nantes · 44200</span></p>
    <p class="sub">On écrase. Ça caramélise. <b>Ça devient meilleur.</b> Le smash burger de la rue Louis-Blanc.</p>
    <div class="ctas"><a class="btn btn--ch" href="#">Voir la carte</a><a class="btn btn--ln" href="#">Commander</a></div>
  </div>
</section>
<script src="../js/vendor/gsap.min.js"></script>
<script>
const word=document.getElementById('word'),burger=document.getElementById('burger');
// calibre la taille pour que SMASH en largeur max (125%) remplisse l'écran
function calib(){const span=document.createElement('span');span.textContent='SMASH';span.style.cssText='font:inherit;font-stretch:125%;white-space:nowrap;visibility:hidden;position:absolute';word.appendChild(span);
const fs=100*(innerWidth-24)/span.offsetWidth;span.remove();document.documentElement.style.setProperty('--fs',fs+'px');}
const tl=gsap.timeline({delay:.3,paused:true});document.fonts.ready.then(()=>{calib();tl.play()});
tl.set(word,{fontStretch:'62%',scaleY:1})
  .from(word,{yPercent:40,autoAlpha:0,duration:.8,ease:'expo.out'})
  .fromTo(burger,{y:-innerHeight,rotation:-8},{y:0,rotation:0,duration:.75,ease:'power3.in'},'+=.15')
  // impact : le mot s'élargit et s'aplatit
  .to(word,{fontStretch:'125%',scaleY:.42,duration:.18,ease:'power4.out'})
  .to(burger,{scaleY:.9,scaleX:1.06,transformOrigin:'50% 100%',duration:.12,yoyo:true,repeat:1},'<')
  .to('#shadow',{opacity:1,duration:.3},'<')
  .add(()=>crumbs(),'<')
  .to(word,{scaleY:.62,duration:.9,ease:'elastic.out(1,.35)'})
  .to(burger,{y:-10,duration:2.4,ease:'sine.inOut',yoyo:true,repeat:-1},'-=.4')
  .to('.foot>*',{opacity:1,y:0,stagger:.08,duration:.8,ease:'expo.out'},'-=2.2');
gsap.set('.foot>*',{y:20});
function crumbs(){const c=document.getElementById('crumbs');const r=burger.getBoundingClientRect();
  for(let i=0;i<18;i++){const s=document.createElement('span');const side=i%2?1:-1;
    s.style.left=(side>0?r.right-20:r.left+20)+'px';s.style.top=(r.bottom-30)+'px';
    s.style.background=['#FFB71B','#E9852C','#5A2A14'][i%3];c.appendChild(s);
    gsap.to(s,{x:side*(40+Math.random()*120),y:-60-Math.random()*90,rotation:side*300,duration:.5,ease:'power2.out'});
    gsap.to(s,{y:'+=220',opacity:0,duration:.8,delay:.45,ease:'power2.in',onComplete:()=>s.remove()});}
  if(navigator.vibrate)try{navigator.vibrate(15)}catch(e){}}
// tap = re-smash
document.querySelector('.hero').addEventListener('click',e=>{if(e.target.closest('a,button'))return;
  gsap.timeline().to(word,{fontStretch:'62%',scaleY:1,duration:.3,ease:'power2.out'}).to(burger,{y:-120,duration:.3,ease:'power2.out'},'<')
  .to(burger,{y:0,duration:.3,ease:'power3.in'}).to(word,{fontStretch:'125%',scaleY:.42,duration:.15,ease:'power4.out'}).add(crumbs,'<').to(word,{scaleY:.5,duration:.8,ease:'elastic.out(1,.35)'});});
</script>
</body></html>
