<!DOCTYPE html>
<html lang="fr"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>09 — Les vraies photos</title>
<link rel="stylesheet" href="base.css"><link rel="icon" href="../img/favicon.png">
<style>
/* 09 — Les vraies photos du resto tombent comme des polaroïds sur la nappe damier. Glisse la pile. */
.hero{background:var(--g)}
.table{position:absolute;left:-10%;right:-10%;bottom:-6%;height:62%;z-index:0;
  background:conic-gradient(#E9E2D4 25%,#1a1d1b 0 50%,#E9E2D4 0 75%,#1a1d1b 0) 0 0/58px 58px;transform:perspective(600px) rotateX(48deg);transform-origin:50% 100%;opacity:.95}
.table::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,var(--g) 0%,rgba(1,43,26,.2) 40%,rgba(1,43,26,0) 70%)}
.title{position:absolute;left:var(--pad);right:var(--pad);top:calc(80px + var(--st));z-index:5;font-weight:900;font-stretch:125%;text-transform:uppercase;font-size:11.4vw;line-height:.86;letter-spacing:-.045em}
.title em{font-family:var(--f-s);font-style:italic;font-weight:400;text-transform:none;letter-spacing:-.01em;color:var(--ch)}
.pile{position:absolute;left:50%;top:44%;width:62vw;max-width:340px;aspect-ratio:4/5;translate:-50% -50%;z-index:3}
.pol{position:absolute;inset:0;background:#fff;padding:9px 9px 38px;border-radius:3px;box-shadow:0 18px 30px -12px rgba(0,0,0,.55);touch-action:pan-y;will-change:transform}
.pol img{width:100%;height:100%;object-fit:cover}
.pol p{position:absolute;left:12px;right:12px;bottom:9px;color:var(--ink);font-family:var(--f-s);font-style:italic;font-size:17px;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.idx{position:absolute;left:var(--pad);right:var(--pad);top:calc(44% + 44vw);z-index:5;display:flex;justify-content:space-between;align-items:center;font-family:var(--f-m);font-size:10px;letter-spacing:.14em;text-transform:uppercase;opacity:0}
.ctas{position:absolute;left:var(--pad);right:var(--pad);bottom:calc(22px + var(--sb));z-index:6;opacity:0}
</style></head><body>
<section class="hero">
  <div class="table"></div>
  <header class="hd"><svg class="logo"><use href="../assets/logo-sprite.svg#lg"/></svg><div class="hd__r"><span class="status"><i></i>Ouvert</span><button class="menu" aria-label="Menu"><i></i><i></i></button></div></header>
  <h1 class="title">Le burger qui fait <em>parler Nantes.</em></h1>
  <div class="pile" id="pile">
    <figure class="pol" style="margin:0"><img src="../img/ig-table.webp" alt=""><p>la table du vendredi</p></figure>
    <figure class="pol" style="margin:0"><img src="../img/ig-cheddar.webp" alt=""><p>cheddar, beaucoup</p></figure>
    <figure class="pol" style="margin:0"><img src="../img/ig-stack.webp" alt=""><p>le Braisé</p></figure>
    <figure class="pol" style="margin:0"><img src="../img/ig-damier.webp" alt=""><p>sur papier damier</p></figure>
    <figure class="pol" style="margin:0"><img src="../img/ig-melt.webp" alt=""><p>le smash, pressé main</p></figure>
  </div>
  <p class="idx"><span>@bunzo.fr</span><span>Glisse la photo →</span></p>
  <div class="ctas"><a class="btn btn--ch" href="#">Voir la carte</a><a class="btn btn--g" href="#">Commander</a></div>
</section>
<script src="../js/vendor/gsap.min.js"></script>
<script>
const pile=document.getElementById('pile');let cards=[...pile.children];
const rot=()=>gsap.utils.random(-9,9);
cards.forEach((c,i)=>gsap.set(c,{zIndex:i}));
gsap.timeline({delay:.3})
  .from('.title',{y:40,autoAlpha:0,duration:1,ease:'expo.out'})
  .fromTo(cards,{y:-innerHeight,rotation:()=>gsap.utils.random(-40,40),scale:1.3},{y:0,x:()=>gsap.utils.random(-14,14),rotation:rot,scale:1,stagger:.18,duration:.7,ease:'back.out(1.1)'},'-=.6')
  .to('.idx,.ctas',{opacity:1,duration:.6});
// glisser la photo du dessus pour l'envoyer sous la pile
let start=null;const topCard=()=>cards[cards.length-1];
pile.addEventListener('pointerdown',e=>{start={x:e.clientX,y:e.clientY};try{topCard().setPointerCapture(e.pointerId)}catch(_){}});
pile.addEventListener('pointermove',e=>{if(!start)return;const dx=e.clientX-start.x;gsap.set(topCard(),{x:dx,rotation:dx/12})});
pile.addEventListener('pointerup',e=>{if(!start)return;const dx=e.clientX-start.x;start=null;const c=topCard();
  if(Math.abs(dx)<50&&Math.abs(dx)>3){gsap.to(c,{x:0,rotation:rot(),duration:.5,ease:'back.out(2)'});return}
  const dir=dx===0?1:Math.sign(dx);
  gsap.to(c,{x:dir*innerWidth*.9,rotation:dir*30,duration:.35,ease:'power2.in',onComplete:()=>{
    cards.pop();cards.unshift(c);cards.forEach((k,i)=>gsap.set(k,{zIndex:i}));
    gsap.to(c,{x:gsap.utils.random(-14,14),rotation:rot(),duration:.6,ease:'power3.out'});}});});
// défilement auto doux si personne ne touche
setInterval(()=>{if(start)return;pile.dispatchEvent(new PointerEvent('pointerdown',{clientX:0,clientY:0}));pile.dispatchEvent(new PointerEvent('pointerup',{clientX:120,clientY:0}))},4200);
</script>
</body></html>
